services:
  rclone:
    image: rclone/rclone:latest
    container_name: rclone-webgui
    restart: unless-stopped
    command: >
      gui
      --addr :5572
      --api-addr :5573
      --user ${RC_USER:-admin}
      --pass ${RC_PASS:-rclone123}
      --no-open-browser
    ports:
      - "5572:5572"
      - "5573:5573"
    environment:
      - RCLONE_CONFIG=/config/rclone.conf
    volumes:
      - ${PATH_TO_DATA}/rclone/config:/config
      - ${PATH_TO_DATA}/rclone:/data
    # Ruta derivada de la variable global PATH_TO_DATA (igual que los demás compose):
    # en Lenovo/OMV PATH_TO_DATA apunta al disco físico del host.