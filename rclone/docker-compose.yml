services:
  rclone:
    image: rclone/rclone:latest
    container_name: rclone-webgui
    restart: unless-stopped
    command: >
      gui
      --addr :5572
      --api-addr :5573
      --user ${RC_USER:-admin}
      --pass ${RC_PASS:-rclone123}
      --no-open-browser
    ports:
      - "5572:5572"
      - "5573:5573"
    environment:
      - RCLONE_CONFIG=/config/rclone.conf
    volumes:
      # Configuración (rclone.conf, remotes) → PATH_TO_APPDATA
      - ${PATH_TO_APPDATA}/rclone/config:/config
      # Datos (archivos que rclone maneja, montas) → PATH_TO_DATA
      - ${PATH_TO_DATA}/rclone:/data